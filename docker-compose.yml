version: '3.8'

services:
  winforms-checker:
    build: .
    ports:
      - "3000:3000"   # API
      - "6080:6080"   # noVNC web interface
    volumes:
      - ./uploads:/app/uploads
      - ./projects:/app/projects
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For spawning review containers
      - review-input:/app/review-input    # Shared volume for project files
      - review-output:/app/review-output  # Shared volume for review results
    environment:
      - DISPLAY=:99
      - WINEPREFIX=/opt/wine-dotnet
      - WINEDEBUG=-all
    # Security settings
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT  # Needed for Wine
    mem_limit: 4g
    cpus: 4.0

volumes:
  review-input:
  review-output:
