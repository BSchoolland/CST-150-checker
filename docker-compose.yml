version: '3.8'

services:
  winforms-checker:
    build: .
    ports:
      - "3000:3000"   # API
      # Note: VNC ports 6081-6083 are NOT mapped here
      # Session containers bind directly to host ports via docker socket
    volumes:
      - ./uploads:/app/uploads
      - ./projects:/app/projects
      - /var/run/docker.sock:/var/run/docker.sock  # For spawning session containers (rw needed)
      - ./review-input:/app/review-input    # Bind mount for project files (review)
      - ./review-output:/app/review-output  # Bind mount for review results
    environment:
      - DISPLAY=:99
      - HOST_PROJECT_DIR=${PWD}/projects
      - HOST_REVIEW_INPUT_DIR=${PWD}/review-input
      - HOST_REVIEW_OUTPUT_DIR=${PWD}/review-output
      - REVIEW_INPUT_BASE=/app/review-input
      - REVIEW_OUTPUT_BASE=/app/review-output
    # Security settings - main container is orchestrator only (no Wine)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
