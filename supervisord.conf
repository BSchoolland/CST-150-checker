[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24
autorestart=true
priority=100

[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -forever -shared
autorestart=true
priority=200
startsecs=3

[program:websockify]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=300
startsecs=5
